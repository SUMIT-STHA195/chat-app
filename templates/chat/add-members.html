<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Multiple Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h3 class="card-title text-center mb-4">{{ room_name }}</h3>
        <form method="POST">
            {% csrf_token %}
            <h5>Select Members</h5>
            <div class="mb-3">
                <div class="btn-group" role="group" aria-label="Users">
                    {% for user in users %}
                    <input type="checkbox" class="btn-check" name="users" id="user{{ user.id }}" value="{{ user.id }}">
                    <label class="btn btn-outline-primary m-1" for="user{{ user.id }}">
                        {{ user.first_name }} {{ user.last_name }}
                    </label>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Add Members</button>
            {% if error_msg%}
            <p>{{error_msg}}</p>
            {% endif %}
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
