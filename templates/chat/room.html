{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Chat Room</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .chat-card {
            max-width: 900px;
            margin: 60px auto;
            border-radius: 15px;
            overflow: hidden;
        }

        .chat-header {
            background: #4c51bf;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        .chat-body {
            background: #f8f9fa;
            height: 420px;
            overflow-y: auto;
            padding: 15px;
        }

        .chat-message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .me {
            background: #4c51bf;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .other {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .username {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .timestamp {
            font-size: 0.65rem;
            opacity: 0.7;
            text-align: right;
        }

        .chat-footer {
            padding: 15px;
            background: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card shadow chat-card">

            <div class="chat-header">
                💬 Room: {{ room_name }}
                {% if is_admin %}
                <a href="{% url 'chat:add-members' room_name%}"> Add</a>
                {% endif %}
            </div>

            <div id="chat-log" class="chat-body"></div>

            <div class="chat-footer">
                <div class="input-group">
                    <input id="chat-message-input" class="form-control" placeholder="Type message..."
                        autocomplete="off">
                    <button id="chat-message-submit" class="btn btn-primary">Send</button>
                </div>
            </div>

        </div>
    </div>

    {{ room_name|json_script:"room-name" }}
    {{ chat_history|json_script:"chat-history" }}
    {{ request.user.username|json_script:"current-user" }}

    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);
        console.log(roomName);

        const chatHistory = JSON.parse(document.getElementById('chat-history').textContent);
        const currentUser = JSON.parse(document.getElementById('current-user').textContent);
        const chatLog = document.getElementById('chat-log');
        const messageInput = document.getElementById('chat-message-input');

        function addMessage(sender, content, timestamp) {
            const div = document.createElement('div');
            div.classList.add('chat-message', sender === currentUser ? 'me' : 'other');

            div.innerHTML = `
            <div class="username">${sender}</div>
            <div>${content}</div>
            <div class="timestamp">${timestamp}</div>
        `;

            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Load DB messages
        chatHistory.forEach(msg => {
            addMessage(msg.sender, msg.content, msg.timestamp);
        });

        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
        );
        console.log(window.location.host);

        chatSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            addMessage(data.sender, data.content, data.timestamp);
        };
        // press enter to send message
        messageInput.focus()
        messageInput.onkeyup = function (e) {
            if (e.key === 'Enter') {
                document.querySelector('#chat-message-submit').click();
            }
        };
        document.getElementById('chat-message-submit').onclick = function () {
            const message = messageInput.value.trim();
            console.log(message);

            if (message !== "") {
                chatSocket.send(JSON.stringify({ message: message }));
                messageInput.value = "";
            }
        };
    </script>
</body>

</html>
