{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Chat Room</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .chat-wrapper {
            max-width: 900px;
            margin: 60px auto;
        }

        .chat-body {
            height: 420px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        .chat-message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .chat-message.me {
            background-color: #4c51bf;
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .chat-message.other {
            background-color: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .username {
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0.8;
        }

        .timestamp {
            font-size: 0.65rem;
            opacity: 0.6;
            text-align: right;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card shadow-lg chat-wrapper rounded-4 overflow-hidden">

            <!-- Header -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span class="fw-semibold">💬 Room: {{ room_name }}</span>

                {% if is_admin %}
                <a href="{% url 'chat:add-members' room_name %}" class="btn btn-light btn-sm">
                    + Add Members
                </a>
                {% endif %}
            </div>

            <!-- Chat Body -->
            <div id="chat-log" class="chat-body p-3"></div>

            <!-- Footer -->
            <div class="card-footer bg-white">
                <div class="input-group">
                    <input id="chat-message-input" class="form-control" placeholder="Type your message..."
                        autocomplete="off">
                    <button id="chat-message-submit" class="btn btn-primary">
                        Send
                    </button>
                </div>
            </div>

        </div>
    </div>

    {{ room_name|json_script:"room-name" }}
    {{ chat_history|json_script:"chat-history" }}
    {{ request.user.username|json_script:"current-user" }}

    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);
        const chatHistory = JSON.parse(document.getElementById('chat-history').textContent);
        const currentUser = JSON.parse(document.getElementById('current-user').textContent);

        const chatLog = document.getElementById('chat-log');
        const messageInput = document.getElementById('chat-message-input');

        function addMessage(sender, content, timestamp) {
            const div = document.createElement('div');
            div.classList.add('chat-message', sender === currentUser ? 'me' : 'other');

            div.innerHTML = `
                <div class="username">${sender}</div>
                <div>${content}</div>
                <div class="timestamp">${timestamp}</div>
            `;

            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Load existing messages
        chatHistory.forEach(msg => {
            addMessage(msg.sender, msg.content, msg.timestamp);
        });

        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
        );

        chatSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            addMessage(data.sender, data.content, data.timestamp);
        };

        messageInput.focus();
        messageInput.onkeyup = function (e) {
            if (e.key === 'Enter') {
                document.getElementById('chat-message-submit').click();
            }
        };

        document.getElementById('chat-message-submit').onclick = function () {
            const message = messageInput.value.trim();
            if (message !== "") {
                chatSocket.send(JSON.stringify({ message: message }));
                messageInput.value = "";
            }
        };
    </script>

</body>

</html>
