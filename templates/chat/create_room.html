<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if messages%}
    {% for msg in messages%}
    <p>{{msg}}</p>
    {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="room_name">Name of Group:</label>
        <input type="text" name="room_name">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
